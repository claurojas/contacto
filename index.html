<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clau Rojas · Contacto</title>
<meta name="theme-color" content="#222550">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#222550;--panel:#2c3063;--line:#3d4285;--cyan:#1ba8e4;--purple:#564b99;--text:#fff;--muted:#b9bde0}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Figtree,system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:28px 20px 40px}
main{width:100%;max-width:420px}
.logo{display:block;width:100%;max-width:340px;margin:0 auto 6px}
.role{text-align:center;color:var(--muted);font-size:.98rem;margin:0 0 24px;line-height:1.55}
.save{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;border:0;border-radius:14px;background:var(--cyan);color:#0d1236;font:700 1.15rem Figtree,system-ui,sans-serif;cursor:pointer}
.save:hover{filter:brightness(1.08)}
ul{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:10px}
a.row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600;font-size:1.05rem}
a.row:hover{border-color:var(--cyan)}
.ico{flex:none;width:40px;height:40px;border-radius:50%;background:var(--purple);display:grid;place-items:center}
.ico svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sub{display:block;font-weight:400;font-size:.9rem;color:var(--muted)}
.save:focus-visible,a.row:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
